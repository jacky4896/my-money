<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#167b53">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="我的账本">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="ledger-icon.svg">
  <title>我的账本</title>
  <style>
    :root{--ink:#17212b;--muted:#64748b;--line:#e6ebf0;--bg:#f6f8f7;--card:#fff;--green:#167b53;--green-pale:#e8f5ee;--red:#c44545;--red-pale:#fff0f0;--blue:#275d9f}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif} button,input,select{font:inherit} button{cursor:pointer}
    .wrap{max-width:860px;margin:auto;padding:28px 18px 56px} header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px} h1{font-size:26px;margin:0;letter-spacing:-.5px}.sub{color:var(--muted);font-size:14px;margin:3px 0 0}.month{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink)}.head-actions{display:flex;align-items:center;gap:8px}.signout{border:0;background:none;color:var(--muted);font-size:13px;padding:6px}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 26px}.quick button{border:0;border-radius:14px;padding:16px;color:#fff;font-weight:650;font-size:17px}.expense{background:var(--red)}.income{background:var(--green)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 24px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}.label{font-size:13px;color:var(--muted)}.value{font-size:21px;font-weight:700;margin:4px 0 1px}.hint{font-size:12px;color:var(--muted)}
    section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:15px}h2{font-size:17px;margin:0 0 13px}.currency-list{display:flex;flex-wrap:wrap;gap:9px}.pill{background:var(--green-pale);color:var(--green);padding:6px 10px;border-radius:99px;font-size:14px}.bar-row{display:grid;grid-template-columns:72px 1fr 75px;gap:9px;align-items:center;margin:10px 0;font-size:14px}.bar{height:9px;background:#eef1f3;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:10px}.amount{text-align:right;font-variant-numeric:tabular-nums}
    .transactions{padding:0;overflow:hidden}.section-head{padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between}.text-btn{background:none;border:0;color:var(--blue);padding:3px}.transaction{display:grid;grid-template-columns:40px 1fr auto;gap:10px;padding:13px 18px;border-top:1px solid var(--line);align-items:center}.icon{height:34px;width:34px;border-radius:50%;display:grid;place-items:center;background:#f1f4f5}.name{font-weight:600}.meta{font-size:13px;color:var(--muted);margin-top:2px}.out{color:var(--red);font-weight:650}.in{color:var(--green);font-weight:650}.empty{padding:22px 18px;color:var(--muted);text-align:center}
    dialog{border:0;border-radius:16px;padding:0;max-width:480px;width:calc(100% - 32px);box-shadow:0 18px 50px #0003}dialog::backdrop{background:#15202b99}.dialog-inner{padding:20px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0}.close{background:none;border:0;font-size:26px;line-height:1;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.full{grid-column:1/-1}label{font-size:13px;color:var(--muted);display:grid;gap:5px}input,select{width:100%;border:1px solid #cfd8df;border-radius:9px;padding:10px;background:#fff;color:var(--ink)}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.secondary,.primary{border:0;border-radius:9px;padding:10px 14px;font-weight:600}.secondary{background:#eef2f4;color:var(--ink)}.primary{background:var(--green);color:#fff}.danger{color:var(--red);margin-right:auto;background:none;border:0;padding:8px}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rate input{margin-top:5px}.footer{display:flex;justify-content:flex-end;margin-top:15px}.footer button{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
    #authScreen{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(100%,390px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}.auth-card h1{margin-bottom:5px}.auth-card .form{grid-template-columns:1fr}.auth-actions{display:grid;gap:9px;margin-top:18px}.auth-message{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--muted)}body:not(.signed-in) main{display:none}body.signed-in #authScreen{display:none}@media(max-width:560px){.cards{grid-template-columns:1fr}.rates{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wrap{padding:20px 13px 42px}.value{font-size:23px}}
  </style>
</head>
<body>
  <section id="authScreen" aria-label="登录账本"><div class="auth-card"><h1>我的账本</h1><p class="sub">登录后，电脑和 iPhone 会自动同步。</p><div class="form"><label class="full">Email<input id="authEmail" type="email" autocomplete="email" placeholder="你的 email" required></label><label class="full">密码<input id="authPassword" type="password" autocomplete="current-password" placeholder="你自己设置的密码" required></label></div><div class="auth-actions"><button class="primary" type="button" onclick="login()">登录</button><button class="secondary" type="button" onclick="register()">第一次使用：建立账号</button></div><p id="authMessage" class="auth-message"></p></div></section>
  <main class="wrap">
    <header><div><h1>我的账本</h1><p class="sub">每天记一笔，月底就清楚</p></div><div class="head-actions"><input id="month" class="month" type="month"><button class="signout" onclick="logout()">退出</button></div></header>
    <div class="quick"><button class="expense" onclick="openForm('expense')">− 记一笔开销</button><button class="income" onclick="openForm('income')">＋ 记一笔收入</button></div>
    <div class="cards"><div class="card"><div class="label">本月收入</div><div class="value" id="incomeTotal">RM 0.00</div><div class="hint">按你设定的汇率换算</div></div><div class="card"><div class="label">本月开销</div><div class="value" id="expenseTotal">RM 0.00</div><div class="hint">按你设定的汇率换算</div></div><div class="card"><div class="label">本月剩余</div><div class="value" id="balanceTotal">RM 0.00</div><div class="hint">收入 − 开销</div></div></div>
    <section><h2>各币种余额</h2><div class="currency-list" id="currencyBalances"></div></section>
    <section><h2>本月花在哪里</h2><div id="categoryChart"><div class="empty">还没有开销记录</div></div></section>
    <section class="transactions"><div class="section-head"><h2>记录</h2><button class="text-btn" onclick="openRates()">汇率设置</button></div><div id="transactions"></div></section>
    <div class="footer"><button onclick="downloadBackup()">下载备份</button></div>
  </main>

  <dialog id="entryDialog"><form method="dialog" class="dialog-inner" id="entryForm"><div class="dialog-head"><h2 id="formTitle">记一笔</h2><button class="close" value="cancel" aria-label="关闭">×</button></div><input type="hidden" id="editId"><div class="form">
    <label>类型<select id="type"><option value="expense">开销</option><option value="income">收入</option></select></label>
    <label>日期<input id="date" type="date" required></label>
    <label>金额<input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="例如 20" required></label>
    <label>币种<select id="currency"><option>MYR</option><option>THB</option><option>USD</option><option>KHR</option></select></label>
    <label>分类<select id="category"></select></label>
    <label>备注（可不填）<input id="note" maxlength="40" placeholder="例如：午餐"></label>
  </div><div class="actions"><button type="button" class="danger" id="deleteBtn" onclick="deleteEntry()">删除</button><button class="secondary" value="cancel">取消</button><button class="primary" value="default" onclick="saveEntry(event)">保存</button></div></form></dialog>
  <dialog id="rateDialog"><form method="dialog" class="dialog-inner"><div class="dialog-head"><h2>汇率设置</h2><button class="close" value="cancel" aria-label="关闭">×</button></div><p class="sub">将所有金额统一换算为马币（MYR）</p><div class="rates"><label class="rate">1 THB = MYR<input id="rateTHB" type="number" step="0.0001" min="0"></label><label class="rate">1 USD = MYR<input id="rateUSD" type="number" step="0.0001" min="0"></label><label class="rate">1 KHR = MYR<input id="rateKHR" type="number" step="0.000001" min="0"></label></div><div class="actions"><button class="secondary" value="cancel">取消</button><button class="primary" value="default" onclick="saveRates(event)">保存汇率</button></div></form></dialog>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    window.ledgerCloud=createClient('https://alhtdhpzsdzsqolkzvpo.supabase.co','sb_publishable_TUIhR8u1Jy32E_buJZfGiA_Fo1YNuXh');
    window.dispatchEvent(new Event('ledger-cloud-ready'));
  </script>
  <script>
    const KEY='my-simple-ledger-v1', RATE_KEY='my-simple-ledger-rates';
    const categories={expense:['吃饭','日用品','交通','房租/住宿','电话/网络','娱乐','医疗','转账/换汇','其他'],income:['薪水','换汇','退款','其他']};
    let entries=JSON.parse(localStorage.getItem(KEY)||'[]'); let rates=JSON.parse(localStorage.getItem(RATE_KEY)||'{"MYR":1,"THB":0.13,"USD":4.7,"KHR":0.00115}'); let cloud,user,subscription;
    const $=id=>document.getElementById(id); const today=()=>new Date().toISOString().slice(0,10); const money=(n,c)=>new Intl.NumberFormat('en-MY',{style:'currency',currency:c,maximumFractionDigits:c==='KHR'?0:2}).format(n); const esc=s=>String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    $('month').value=today().slice(0,7); $('month').addEventListener('change',render); $('type').addEventListener('change',updateCategories);
    function updateCategories(selected){const type=$('type').value;$('category').innerHTML=categories[type].map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('')}
    function openForm(type,entry){$('entryForm').reset(); $('editId').value=entry?.id||''; $('type').value=entry?.type||type; $('date').value=entry?.date||today(); $('amount').value=entry?.amount||''; $('currency').value=entry?.currency||'THB'; updateCategories(entry?.category); $('note').value=entry?.note||''; $('formTitle').textContent=entry?'编辑记录':type==='income'?'记一笔收入':'记一笔开销';$('deleteBtn').style.display=entry?'block':'none';$('entryDialog').showModal();}
    function persist(){localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(RATE_KEY,JSON.stringify(rates));saveCloud()}
    function saveEntry(e){e.preventDefault(); const data={id:$('editId').value||crypto.randomUUID(),type:$('type').value,date:$('date').value,amount:Number($('amount').value),currency:$('currency').value,category:$('category').value,note:$('note').value.trim()};if(!data.amount||!data.date)return; const i=entries.findIndex(x=>x.id===data.id);if(i>-1)entries[i]=data;else entries.push(data); persist();$('entryDialog').close();render();}
    function deleteEntry(){const id=$('editId').value;if(!id)return;entries=entries.filter(x=>x.id!==id);persist();$('entryDialog').close();render();}
    function openRates(){['THB','USD','KHR'].forEach(c=>$('rate'+c).value=rates[c]);$('rateDialog').showModal()}
    function saveRates(e){e.preventDefault();['THB','USD','KHR'].forEach(c=>rates[c]=Number($('rate'+c).value)||0);rates.MYR=1;persist();$('rateDialog').close();render();}
    function render(){const m=$('month').value;const list=entries.filter(x=>x.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));let income=0,expense=0;const balances={MYR:0,THB:0,USD:0,KHR:0},cats={};entries.forEach(x=>balances[x.currency]+=(x.type==='income'?1:-1)*x.amount);list.forEach(x=>{const v=x.amount*(rates[x.currency]||0);if(x.type==='income')income+=v;else{expense+=v;cats[x.category]=(cats[x.category]||0)+v}});$('incomeTotal').textContent=money(income,'MYR');$('expenseTotal').textContent=money(expense,'MYR');$('balanceTotal').textContent=money(income-expense,'MYR');$('balanceTotal').style.color=income-expense<0?'var(--red)':'var(--green)';$('currencyBalances').innerHTML=Object.entries(balances).map(([c,n])=>`<span class="pill">${c} ${new Intl.NumberFormat('en-MY',{maximumFractionDigits:c==='KHR'?0:2}).format(n)}</span>`).join('');const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const max=sorted[0]?.[1]||1;$('categoryChart').innerHTML=sorted.length?sorted.map(([c,n])=>`<div class="bar-row"><span>${esc(c)}</span><div class="bar"><i style="width:${n/max*100}%"></i></div><span class="amount">${money(n,'MYR')}</span></div>`).join(''):'<div class="empty">还没有开销记录</div>';$('transactions').innerHTML=list.length?list.map(x=>`<div class="transaction" role="button" tabindex="0" onclick="openForm('${x.type}',entries.find(e=>e.id==='${x.id}'))" onkeydown="if(event.key==='Enter')openForm('${x.type}',entries.find(e=>e.id==='${x.id}'))"><div class="icon">${x.type==='income'?'＋':'−'}</div><div><div class="name">${esc(x.note||x.category)}</div><div class="meta">${esc(x.date)} · ${esc(x.category)}</div></div><div class="${x.type==='income'?'in':'out'}">${x.type==='income'?'+':'−'}${money(x.amount,x.currency)}</div></div>`).join(''):'<div class="empty">这个月还没有记录</div>'}
    function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({entries,rates},null,2)],{type:'application/json'}));a.download='我的账本备份.json';a.click();URL.revokeObjectURL(a.href)}
    function showAuthMessage(message,error=false){$('authMessage').textContent=message;$('authMessage').style.color=error?'var(--red)':'var(--muted)'}
    async function login(){const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password)return showAuthMessage('请输入 email 和密码。',true);showAuthMessage('正在登录…');const {error}=await cloud.auth.signInWithPassword({email,password});if(error)showAuthMessage(error.message,true)}
    async function register(){const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password)return showAuthMessage('请输入 email 和密码。',true);showAuthMessage('正在建立账号…');const {data,error}=await cloud.auth.signUp({email,password});if(error)return showAuthMessage(error.message,true);if(!data.session)showAuthMessage('请到 email 收件箱确认账号，然后回来登录。');}
    async function useSession(session){if(!session){document.body.classList.remove('signed-in');return}user=session.user;const {data,error}=await cloud.from('ledger_state').select('*').eq('user_id',user.id).maybeSingle();if(error){showAuthMessage('无法读取云端账本：'+error.message,true);return}if(data){entries=data.entries||[];rates={...rates,...(data.rates||{})};localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(RATE_KEY,JSON.stringify(rates));}else await saveCloud();document.body.classList.add('signed-in');render();if(subscription)cloud.removeChannel(subscription);subscription=cloud.channel('ledger-'+user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'ledger_state',filter:'user_id=eq.'+user.id},payload=>{entries=payload.new.entries||[];rates={...rates,...(payload.new.rates||{})};localStorage.setItem(KEY,JSON.stringify(entries));localStorage.setItem(RATE_KEY,JSON.stringify(rates));render()}).subscribe();}
    async function saveCloud(){if(!cloud||!user)return;const {error}=await cloud.from('ledger_state').upsert({user_id:user.id,entries,rates,updated_at:new Date().toISOString()});if(error)console.error(error)}
    async function logout(){if(subscription)cloud.removeChannel(subscription);await cloud.auth.signOut();user=null;document.body.classList.remove('signed-in');$('authPassword').value='';showAuthMessage('已退出。')}
    window.addEventListener('ledger-cloud-ready',async()=>{cloud=window.ledgerCloud;const {data}=await cloud.auth.getSession();await useSession(data.session);cloud.auth.onAuthStateChange((_event,session)=>useSession(session));});
    if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js');
  </script>
</body>
</html>
